[project]
name = "nicegui-ai"
version = "0.2.0"
description = "Modern AI agent UI primitives for NiceGUI (1:1 port of assistant-ui and Vercel AI SDK)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Malcom Van Luther", email = "ivmno1special@gmail.com" }
]
requires-python = ">=3.13"
keywords = [
    "nicegui",
    "ai",
    "agent",
    "assistant-ui",
    "ui-components",
    "llm",
    "chat",
    "reasoning",
    "tool-calling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "nicegui>=3.18.0",
]

[project.scripts]
nicegui-ai = "nicegui_ai.gallery:main"
nicegui-ai-demo = "nicegui_ai.demo:main"

[project.urls]
Homepage = "https://github.com/IAmNo1Special/nicegui-ai"
Repository = "https://github.com/IAmNo1Special/nicegui-ai"
Issues = "https://github.com/IAmNo1Special/nicegui-ai/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = ["E501", "SIM117"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["tests/", "demo/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
